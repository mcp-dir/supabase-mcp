# Smithery configuration for Supabase
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_supabase

name: supabase-mcp
displayName: "Supabase"
description: >
  Sua conta Supabase por linguagem natural: rode SQL, aplique migrations, gerencie tabelas, storage, edge functions e branches, e consulte a documentação. Conecte com sua conta em um clique, sem chave nem token.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/supabase-mcp
repository: https://github.com/mcp-dir/supabase-mcp

tags:
  - supabase
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_supabase

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_supabase/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
